<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Despesas</title>
<style>
  :root { --fundo: #0b0f17; --painel: #151b27; --linha: #1f2a3d; --texto: #eef2f8; --suave: #8d98ab;
          --barra: #3ea6ff; --verde: #4cd07d; --vermelho: #ff6b6b; --amarelo: #ffc75f; font-size: 1.6vw; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); overflow: hidden;
               font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-variant-numeric: tabular-nums; }
  .cena { position: fixed; inset: 0; padding: 6vh 6vw 9vh; display: none; flex-direction: column; }
  .cena.ativa { display: flex; animation: entra .4s ease; }
  @keyframes entra { from { opacity: 0; transform: translateY(1.5vh); } }
  .rotulo { font-size: 1.7rem; color: var(--suave); text-transform: uppercase; letter-spacing: .12em; }
  h1 { font-size: 3.6rem; font-weight: 600; margin: .6rem 0 0; }

  /* ---------- cena "o mês" */
  .heroi { margin: 4vh 0 3.5vh; }
  .heroi .valor { font-size: 9rem; font-weight: 250; line-height: 1; }
  .heroi .comp { font-size: 2.1rem; color: var(--suave); margin-top: 1.4rem; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; margin-bottom: 5vh; }
  .kpi { background: var(--painel); border-radius: 1.4rem; padding: 2rem 2.2rem; }
  .kpi .n { font-size: 3.6rem; font-weight: 500; margin-top: .4rem; }
  .cats { display: flex; flex-direction: column; gap: 1.9rem; }
  .cat .topo { display: flex; align-items: baseline; gap: 1rem; font-size: 2.2rem; }
  .cat .nome { font-weight: 600; }
  .cat .v { margin-left: auto; font-weight: 600; }
  .cat .barra { position: relative; height: 1.1rem; background: var(--linha); border-radius: 1rem; margin: .8rem 0 .5rem; }
  .cat .barra i { position: absolute; inset: 0 auto 0 0; border-radius: 1rem; background: var(--barra); }
  .cat .barra i.dentro { background: var(--verde); }
  .cat .barra i.acima { background: var(--vermelho); }
  .cat .barra u { position: absolute; top: -.5rem; bottom: -.5rem; width: .3rem; background: var(--texto); border-radius: .2rem; opacity: .8; }
  .cat .info { display: flex; gap: 1.6rem; font-size: 1.55rem; color: var(--suave); }
  .sobe { color: var(--amarelo); }
  .desce { color: var(--verde); }
  .pilula { font-size: 1.4rem; padding: .25rem 1rem; border-radius: 99rem; }
  .pilula.dentro { background: rgba(76,208,125,.15); color: var(--verde); }
  .pilula.acima { background: rgba(255,107,107,.15); color: var(--vermelho); }

  /* ---------- cena "evolução" */
  .grafico { display: flex; align-items: flex-end; gap: 1.6rem; height: 34vh; margin: 6vh 0 2vh;
             border-bottom: .2rem solid var(--linha); }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: .8rem; }
  .col .par { display: flex; align-items: flex-end; gap: .6rem; height: 100%; width: 100%; justify-content: center; }
  .col .b { width: 40%; border-radius: .8rem .8rem 0 0; background: var(--barra); position: relative; }
  .col .b.e { background: #2b3b55; }
  .col .lbl { font-size: 1.4rem; color: var(--suave); position: absolute; top: -2.3rem; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .meses { display: flex; gap: 1.6rem; }
  .meses div { flex: 1; text-align: center; font-size: 1.9rem; color: var(--suave); }
  .meses div.atual { color: var(--texto); font-weight: 600; }
  .legenda { display: flex; gap: 3rem; font-size: 1.6rem; color: var(--suave); margin-top: 2.4rem; }
  .legenda i { display: inline-block; width: 1.4rem; height: 1.4rem; border-radius: .3rem; margin-right: .7rem; vertical-align: -.1rem; }
  h2 { font-size: 2.6rem; font-weight: 600; margin: 7vh 0 2.4rem; }
  .obj { background: var(--painel); border-radius: 1.4rem; padding: 2rem 2.2rem; margin-bottom: 1.6rem; }
  .obj .topo { display: flex; justify-content: space-between; font-size: 2.2rem; font-weight: 600; }
  .obj .barra { height: 1.2rem; background: var(--linha); border-radius: 1rem; margin: 1.2rem 0 .8rem; overflow: hidden; }
  .obj .barra i { display: block; height: 100%; border-radius: 1rem; }
  .obj .sub { font-size: 1.6rem; color: var(--suave); }
  .vazio { font-size: 1.9rem; color: var(--suave); }

  .rodape { position: fixed; left: 6vw; right: 6vw; bottom: 3.5vh; display: flex; align-items: center; justify-content: space-between;
            font-size: 1.5rem; color: var(--suave); }
  .pontos { display: flex; gap: 1rem; }
  .pontos i { width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--linha); }
  .pontos i.ativa { background: var(--barra); }
  #pausa { display: none; }
  body.parado #pausa { display: inline; }
  .aviso-cat { color: var(--amarelo); }
  /* Modo demo: uma faixa que não deixa dúvidas de que os números são a fingir */
  body.demo::before { content: "DEMO · DADOS FICTÍCIOS"; position: fixed; top: 2vh; right: 6vw; z-index: 2; font-size: 1.4rem;
                      letter-spacing: .12em; color: var(--amarelo); border: .15rem solid var(--amarelo); border-radius: 99rem; padding: .4rem 1.2rem; }
</style>
</head>
<body>
  <section class="cena" id="c-mes"></section>
  <section class="cena" id="c-evolucao"></section>
  <div class="rodape">
    <span id="fonte"></span>
    <span><span id="pausa">⏸ </span><span class="pontos"><i></i><i></i></span></span>
  </div>

<script>
const ROTACAO = 15000;
const eur0 = new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const euro = (v) => eur0.format(Math.round(v));
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const nomeMes = (m, ano = true) => cap(new Date(m + "-15").toLocaleDateString("pt-PT", ano ? { month: "long", year: "numeric" } : { month: "short" })).replace(".", "");
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function comparar(valor, normal) {
  if (normal == null) return "";
  if (normal === 0) return valor > 0 ? "não é habitual" : "";
  const d = (valor - normal) / normal;
  if (Math.abs(d) < 0.1) return `dentro do normal (${euro(normal)})`;
  return d > 0 ? `<span class="sobe">▲ ${Math.round(d * 100)}% acima do normal (${euro(normal)})</span>`
               : `<span class="desce">▼ ${Math.round(-d * 100)}% abaixo do normal (${euro(normal)})</span>`;
}

function cenaMes(d) {
  const max = Math.max(...d.categorias.map((c) => Math.max(c.valor, c.objetivo && c.objetivo.periodo === "mensal" ? c.objetivo.valor : 0)), 1);
  const sobra = d.entradas - d.saidas;
  // Cabem 8 categorias; as mais pequenas juntam-se numa linha "Outras"
  const MAX_CATS = 8;
  let lista = d.categorias.filter((c) => c.valor > 0);
  if (lista.length > MAX_CATS) {
    const resto = lista.slice(MAX_CATS - 1);
    lista = lista.slice(0, MAX_CATS - 1);
    lista.push({ nome: `Outras (${resto.length})`, valor: resto.reduce((s, c) => s + c.valor, 0), normal: null,
                 sub: resto.map((c) => ({ nome: c.nome, valor: c.valor })) });
  }
  const cats = lista.map((c) => {
    const o = c.objetivo;
    const mensal = o && o.periodo === "mensal";
    const est = mensal ? o.estado : "";
    const subs = (c.sub || []).map((s) => `${esc(s.nome)} ${euro(s.valor)}`).join(" · ");
    return `<div class="cat">
      <div class="topo"><span class="nome">${esc(c.nome)}</span>
        ${mensal ? `<span class="pilula ${est}">objetivo ${euro(o.valor)}</span>` : ""}
        <span class="v">${euro(c.valor)}</span></div>
      <div class="barra"><i class="${est}" style="width:${(c.valor / max) * 100}%"></i>
        ${mensal ? `<u style="left:${(o.valor / max) * 100}%"></u>` : ""}</div>
      <div class="info">${[comparar(c.valor, c.normal), subs].filter(Boolean).map((t) => `<span>${t}</span>`).join("")}</div>
    </div>`;
  }).join("");
  document.getElementById("c-mes").innerHTML = `
    <div class="rotulo">Despesas do mês</div>
    <h1>${nomeMes(d.mes)}</h1>
    <div class="heroi"><div class="valor">${euro(d.saidas)}</div>
      <div class="comp">${comparar(d.saidas, d.saidas_normal) || "gasto no mês"}</div></div>
    <div class="kpis">
      <div class="kpi"><div class="rotulo">Entrou</div><div class="n">${euro(d.entradas)}</div></div>
      <div class="kpi"><div class="rotulo">${sobra >= 0 ? "Sobrou" : "Faltou"}</div>
        <div class="n" style="color:var(${sobra >= 0 ? "--verde" : "--vermelho"})">${euro(Math.abs(sobra))}</div></div>
    </div>
    <div class="cats">${cats}</div>`;
}

function cenaEvolucao(d) {
  const ev = d.evolucao;
  const max = Math.max(...ev.flatMap((m) => [m.saidas, m.entradas]), 1);
  const cols = ev.map((m) => `<div class="col"><div class="par">
      <div class="b" style="height:${(m.saidas / max) * 100}%"><span class="lbl">${Math.round(m.saidas)}</span></div>
      <div class="b e" style="height:${(m.entradas / max) * 100}%"></div></div></div>`).join("");
  const meses = ev.map((m) => `<div class="${m.mes === d.mes ? "atual" : ""}">${nomeMes(m.mes, false)}</div>`).join("");

  const objs = d.categorias.filter((c) => c.objetivo).map((c) => {
    const o = c.objetivo;
    const pct = Math.min(o.gasto / o.valor, 1) * 100;
    const cor = o.estado === "acima" ? "var(--vermelho)" : "var(--verde)";
    const resto = o.valor - o.gasto;
    const txt = o.periodo === "anual"
      ? `${euro(o.gasto)} de ${euro(o.valor)} no ano · ${resto >= 0 ? `faltam ${euro(resto)}` : `passou ${euro(-resto)}`}`
      : `${euro(o.gasto)} de ${euro(o.valor)} este mês · ${resto >= 0 ? `sobraram ${euro(resto)}` : `passou ${euro(-resto)}`}`;
    return `<div class="obj"><div class="topo"><span>${esc(c.nome)}</span><span style="color:${cor}">${o.estado === "acima" ? "Acima" : "Dentro"}</span></div>
      <div class="barra"><i style="width:${pct}%;background:${cor}"></i></div><div class="sub">${txt}</div></div>`;
  }).join("") || `<div class="vazio">Ainda não há objetivos. Definem-se no separador Resumo da app de despesas.</div>`;

  document.getElementById("c-evolucao").innerHTML = `
    <div class="rotulo">Últimos meses</div>
    <h1>Gasto vs. entrado (€)</h1>
    <div class="grafico">${cols}</div>
    <div class="meses">${meses}</div>
    <div class="legenda"><span><i style="background:var(--barra)"></i>Gasto</span><span><i style="background:#2b3b55"></i>Entrou</span></div>
    <h2>Objetivos</h2>${objs}
    ${d.por_categorizar ? `<h2 class="aviso-cat">${d.por_categorizar} movimento(s) por categorizar</h2>` : ""}`;
}

// ---------------------------------------------------------------- rotação
const cenas = [...document.querySelectorAll(".cena")];
const pontos = [...document.querySelectorAll(".pontos i")];
let atual = 0, parado = false, tRodar;
function mostrar(i) {
  atual = (i + cenas.length) % cenas.length;
  cenas.forEach((c, k) => c.classList.toggle("ativa", k === atual));
  pontos.forEach((p, k) => p.classList.toggle("ativa", k === atual));
  clearTimeout(tRodar);
  if (!parado) tRodar = setTimeout(() => mostrar(atual + 1), ROTACAO);
}

// ---------------------------------------------------------------- protocolo MonitorHub (PROTOCOLO.md)
const hub = (m) => parent !== window && parent.postMessage({ monitorhub: 1, ...m }, "*");
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.monitorhub !== 1 || m.tipo !== "comando") return;
  if (m.acao === "direita") mostrar(atual + 1);
  else if (m.acao === "esquerda") mostrar(atual - 1);
  else if (m.acao === "pausa") {
    parado = !parado;
    document.body.classList.toggle("parado", parado);
    hub({ tipo: "aviso", texto: parado ? "⏸ Em pausa" : "▶ A rodar" });
    mostrar(atual);
  } else hub({ tipo: "nao_tratado", acao: m.acao });
});

// ?demo=1: dados inventados, para mostrar como funciona sem mostrar as vossas contas
const DEMO = new URLSearchParams(location.search).has("demo");
if (DEMO) document.body.classList.add("demo");
fetch(DEMO ? "despesas-demo.json" : "/dados/despesas.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => {
    if (d.vazio) throw new Error("vazio");
    cenaMes(d);
    cenaEvolucao(d);
    document.getElementById("fonte").textContent = DEMO ? "DEMO · dados fictícios" : `Último extracto: ${nomeMes(d.mes)}`;
    mostrar(0);
  })
  .catch(() => {
    cenas[0].innerHTML = `<div class="rotulo">Despesas</div><h1>Sem dados</h1>
      <p class="vazio">Não encontrei o resumo das despesas. Importa um extracto na app de despesas e volta a abrir.</p>`;
    mostrar(0);
  });
hub({ tipo: "pronto", acoes: ["esquerda", "direita", "pausa", "voltar"] });
</script>
</body>
</html>
